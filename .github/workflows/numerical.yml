name: MATLAB-compatible numerical synthesis
on: [push, pull_request]
permissions:
  contents: read
jobs:
  octave:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Synthesizer/scripts
            tests
            examples
          filter: blob:none
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends octave
      - name: Reproduce original simulator failure
        run: |
          git fetch --depth=1 origin 333f756a72a03f4103d72c9a0780a18ac0ed198f
          mkdir -p /tmp/radarforge-baseline
          git show 333f756a72a03f4103d72c9a0780a18ac0ed198f:Synthesizer/scripts/functions/simulate_radar_signal.m > /tmp/radarforge-baseline/simulate_radar_signal.m
          octave --no-gui --quiet --eval "addpath('Synthesizer/scripts'); addpath('/tmp/radarforge-baseline','-begin'); failed=false; try, simulate_radar_signal([0,6,0]); catch err, disp(err.message); failed=true; end; assert(failed);"
      - name: Existing DSP and full scene synthesis
        run: octave --no-gui --quiet --eval "run('tests/smoke_test.m'); run('tests/synthesis_test.m');"
      - name: Recompute inspectable changed-input scenes
        run: octave --no-gui --quiet --eval "addpath('examples'); scene_to_heatmap('/tmp/radarforge-6m',6,42); scene_to_heatmap('/tmp/radarforge-8m',8,43);"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-scenes
          path: /tmp/radarforge-*
